kind = "mobile"
previewPath = "/"
title = "TiliGo - Dërgesa Shpejt"
version = "1.0.0"
id = "artifacts/tiligo"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 22804
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/tiligo run dev"

[services.env]
PORT = "22804"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/tiligo", "run", "build"]
run = ["pnpm", "--filter", "@workspace/tiligo", "run", "serve"]
